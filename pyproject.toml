[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "urbanflow"
version = "0.1.0"
description = "UrbanFlow AI — Intelligent Urban Traffic Management Platform & 3D Digital Twin"
authors = [{ name = "UrbanFlow AI Team" }]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "pandas>=2.0.0",
    "starlette>=0.28.0",
    "uvicorn>=0.22.0",
    "websockets>=11.0",
    "networkx>=3.0",
    "joblib>=1.3",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[project.optional-dependencies]
sumo = [
    "traci>=1.18.0",
    "sumolib>=1.18.0",
]
dev = [
    "pytest>=7.4.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
include = ["urbanflow*"]

[tool.setuptools.package-data]
urbanflow = ["web/*.html", "web/css/*.css", "web/js/*.js", "web/vendor/*"]
